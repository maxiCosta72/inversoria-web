const CFG={"url": "https://vyyqbwbctlghxxebztmd.supabase.co", "clave": "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ5eXFid2JjdGxnaHh4ZWJ6dG1kIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwODEwNjUsImV4cCI6MjEwNzY1NzA2NX0.9QTJJKM5SqIimVe-pBqaN1tk9YS8SSOTcOM7kOJdkZ4"}, DIAS=30, $=s=>document.querySelector(s), caja=$('#contenido');
const destino=(()=>{const v=new URLSearchParams(location.search).get('volver')||'';return /^[a-z]+\.html$/.test(v)?v:'reporte.html'})();
if(!window.supabase||!CFG.url){caja.innerHTML="<p>No se pudo cargar el acceso. Revisá tu conexión y recargá la página.</p>";return}
const sb=window.supabase.createClient(CFG.url,CFG.clave,{auth:{persistSession:true,storageKey:'inversoria-usuarios'}});
const traducir=m=>/Invalid login/i.test(m)?'Mail o contraseña incorrectos.':/Email not confirmed/i.test(m)?'La cuenta no está confirmada.':m;
async function abrirSitio(){
  const {data,error}=await sb.from('sitio_llave').select('llave').eq('id',1).maybeSingle();
  if(error||!data||!data.llave){throw new Error(error?error.message:'El sitio todavía no está listo: probá de nuevo en unos minutos.')}
  localStorage.setItem('staticrypt_passphrase',data.llave);
  localStorage.setItem('staticrypt_expiration',String(Date.now()+DIAS*864e5));
  location.replace(destino);
}
function formulario(msg){
  caja.innerHTML=`<h1>Ingresar</h1><p>Entrá con tu mail y tu contraseña.</p>
   <form id='f' autocomplete='on'><label for='mail'>Mail</label><input id='mail' type='email' autocomplete='email' required>
   <label for='clave'>Contraseña</label><input id='clave' type='password' autocomplete='current-password' required>
   <button id='b' type='submit'>Entrar</button><div class='err' id='err'>${msg||''}</div></form>
   <p class='nota'>Herramienta privada. Las cuentas las crea el administrador.</p>`;
  $('#mail').focus();
  $('#f').onsubmit=async e=>{e.preventDefault();const b=$('#b'),err=$('#err');err.textContent='';b.disabled=true;b.textContent='Entrando…';
    const {error}=await sb.auth.signInWithPassword({email:$('#mail').value.trim(),password:$('#clave').value});
    if(error){err.textContent=traducir(error.message);b.disabled=false;b.textContent='Entrar';return}
    try{await abrirSitio()}catch(x){err.textContent=x.message;b.disabled=false;b.textContent='Entrar'}};
}
(async()=>{
  if(new URLSearchParams(location.search).has('salir')){await sb.auth.signOut();
    for(const k of Object.keys(localStorage))if(/staticrypt|inversoria-usuarios/i.test(k))localStorage.removeItem(k);
    history.replaceState(null,'',location.pathname);formulario();return}
  const {data:{session}}=await sb.auth.getSession();
  if(session){try{await abrirSitio();return}catch(x){formulario(x.message);return}}
  formulario();
})();
})();
</script></body></html>
